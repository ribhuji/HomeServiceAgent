services:
  langgraph:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: langgraph
    environment:
      HOME_SERVICE_AGENT_MEMORY_DB: /app/data/agent.db
      HOME_SERVICE_AGENT_CHECKPOINT_DB: /app/data/checkpoints.db
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3.5-super-vl:free}
      HOME_SERVICE_AGENT_MAX_MODEL_TURNS: ${HOME_SERVICE_AGENT_MAX_MODEL_TURNS:-3}
      HOME_SERVICE_AGENT_MAX_TOOL_CALLS: ${HOME_SERVICE_AGENT_MAX_TOOL_CALLS:-12}
      HOME_SERVICE_AGENT_MAX_WALL_SECONDS: ${HOME_SERVICE_AGENT_MAX_WALL_SECONDS:-300}
    ports:
      - "2024:2024"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:2024/info', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:2024
      NEXT_PUBLIC_ASSISTANT_ID: home_service_agent
    depends_on:
      langgraph:
        condition: service_healthy
    ports:
      - "3000:3000"

